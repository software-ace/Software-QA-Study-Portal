name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit, data integrity and locator contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No install step and no package manager: the portal has no dependencies,
      # and the tests run on Node's built-in test runner. If this job ever needs
      # an install, a dependency has crept in.
      #
      # `node --test` takes no path argument on purpose: it discovers
      # tests/*.test.mjs by itself, and it is the one form that behaves the same
      # on every supported Node version. A bare directory argument fails on 22+,
      # and glob patterns fail before 21.
      - name: Run tests
        run: node --test
